[project]
name = "maap-stac-auth"
version = "0.1.0"
description = "IaC for authentication and common IAM roles used for the MAAP STAC infrastructure"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-aws-cognito-identitypool-alpha==2.35.0a0",
    "aws-cdk-lib==2.168.0",
    "boto3>=1.37.4",
    "boto3-stubs[cognito-identity,cognito-idp]>=1.37.4",
    "click>=8.1.8",
    "constructs>=10.0.0,<11.0.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv==1.0.0",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
]
ignore = [
  "BLE001",  # Blind Exceptions
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.markdownlint-cli2.config]
MD013 = false

[tool.ruff.lint.isort]
combine-as-imports = true
