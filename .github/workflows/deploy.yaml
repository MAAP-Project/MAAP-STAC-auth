name: Deploy MAAP STAC Auth

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
      aws_region:
        description: 'AWS Region'
        required: true
        type: choice
        options:
          - us-west-2
          - us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ inputs.stage }}
      OWNER: ${{ github.actor }}
      STAC_REGISTER_SERVICE_ID: ${{ vars.STAC_REGISTER_SERVICE_ID }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Configure AWS credentials
        if: github.event_name == 'workflow_dispatch'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE }}
          aws-region: ${{ inputs.aws_region || vars.AWS_REGION }}

      - name: CDK Synth
        run: uv run cdk synth

      - name: CDK Deploy
        if: github.event_name == 'workflow_dispatch'
        run: uv run cdk deploy --require-approval never --all
