name: Deploy MAAP STAC Auth

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment stage'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
      aws_region:
        description: 'AWS Region'
        required: true
        default: 'us-west-2'
        type: choice
        options:
          - us-west-2
          - us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      STAGE: ${{ inputs.stage || 'dev'}}
      OWNER: ${{ github.actor }}
      STAC_REGISTER_SERVICE_ID: ${{ vars.STAC_REGISTER_SERVICE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE }}
          aws-region: ${{ inputs.aws_region || vars.AWS_REGION }}

      - name: CDK Synth
        run: uv run npx cdk synth

      - name: CDK Deploy
        if: github.event_name == 'workflow_dispatch'
        run: uv run npx cdk deploy --require-approval never --all
